services:
  - type: web
    name: capital-flow-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SYNCHRONIZE
        value: "false"
      - key: DB_LOGGING
        value: "false"
      # La base de Neon ya tiene el esquema creado con synchronize y no tiene
      # tabla `migrations`; si esto fuera true, TypeORM intentaría crear tablas
      # que ya existen y el contenedor no arrancaría.
      - key: RUN_MIGRATIONS
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      # URL del frontend, separada por comas. Sin esto, CORS solo permite localhost.
      - key: CORS_ORIGINS
        sync: false
      # Token para habilitar GET /api/seed en producción (opcional).
      - key: SEED_TOKEN
        generateValue: true
      # Cadena de conexión de Neon (usa la "pooled connection" o la directa,
      # con ?sslmode=require). Se define manualmente en el dashboard.
      - key: DATABASE_URL
        sync: false
