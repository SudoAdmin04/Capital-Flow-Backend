services:
  - type: web
    name: capital-flow-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SYNCHRONIZE
        value: "false"
      - key: DB_LOGGING
        value: "false"
      # Migraciones al arrancar. El runner hace baseline automático si la base
      # ya existía (creada con synchronize) y aplica solo lo pendiente, así que
      # es seguro tanto en Neon como en una base nueva.
      - key: RUN_MIGRATIONS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      # URL del frontend, separada por comas. Sin esto, CORS solo permite localhost.
      - key: CORS_ORIGINS
        sync: false
      # Token para habilitar GET /api/seed en producción (opcional).
      - key: SEED_TOKEN
        generateValue: true
      # Cadena de conexión de Neon. Puede incluir ?sslmode=require o no: el
      # driver activa TLS solo en hosts remotos. Se define en el dashboard.
      - key: DATABASE_URL
        sync: false
      # Opcional: fuerza TLS (true) o lo desactiva (false) si la detección
      # automática por host no aplica a tu proveedor.
      - key: DB_SSL
        sync: false
