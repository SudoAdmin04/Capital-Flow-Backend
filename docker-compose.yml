services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-finanzas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finanzas}
      POSTGRES_DB: ${DB_NAME:-finanzas}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-finanzas}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
